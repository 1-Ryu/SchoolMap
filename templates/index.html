<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
    <title>학교어디(대구초등학교맵)</title>
    <meta name="description" content="전보 희망학교를 지도에서 한눈에. 교육지원청·급지·학급수·연구학교·IB·미래학교 조건으로 찾아보세요.">

    <!-- 🌟 카카오톡·SNS 미리보기 카드 (og:image, og:url은 절대주소가 필요해서 서버에서 채워준다) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="학교어디">
    <meta property="og:title" content="학교어디 — 대구 초등학교 지도">
    <meta property="og:description" content="전보 희망학교를 지도에서 한눈에. 교육지원청·급지·학급수·연구학교·IB·미래학교 조건으로 찾아보세요.">
    <!-- 이미지를 바꿀 때는 파일 이름도 함께 바꿔야 한다.
         카카오는 주소 기준으로 이미지를 저장해둬서, 이름이 같으면 새로 받아가지 않는다. -->
    <meta property="og:image" content="https://school-map-psi.vercel.app/og-image-v2.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://school-map-psi.vercel.app/">
    <meta name="twitter:card" content="summary_large_image">

    <!-- 🌟 한글 본문용 가변 폰트 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

    <!-- 🌟 외부 라이브러리 (네이버 지도, PapaParse) -->
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=b5s4g3nfru"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- 🌟 디자인(CSS) 파일 연결
         뒤의 v= 숫자는 브라우저가 예전 파일을 계속 쓰지 않게 하려는 표시다.
         style.css나 app.js를 고쳤으면 이 숫자를 함께 올려야 반영된다. -->
    <link rel="stylesheet" href="style.css?v=11">
</head>
<body>

<div id="map"></div>

<div id="topbar">
    <div class="toprow">
        <div class="searchfield" id="searchfield">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
            </svg>
            <input type="text" id="searchInput" placeholder="학교명 검색" aria-label="학교명 검색" autocomplete="off">
            <button id="searchClear" aria-label="지우기">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
                    <path d="M6 6l12 12M18 6L6 18"/>
                </svg>
            </button>
        </div>

        <button id="filterBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <path d="M4 6h16M7 12h10M10 18h4"/>
            </svg>필터<span class="cnt" id="filterCount">0</span>
        </button>

        <button id="resetBtn" aria-label="조건 초기화" title="조건 초기화">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 11.5A8 8 0 1 1 17.4 6"/><path d="M20.5 3.5V9h-5.5"/>
            </svg>
        </button>
    </div>

    <div id="searchlist"></div>

    <div id="filterpanel">
        <div class="fgroup">
            <h4>교육지원청</h4>
            <div class="fchips" id="fDistrict"></div>
        </div>

        <div class="fgroup">
            <h4>급지</h4>
            <div class="fchips wide" id="fGrade"></div>
            <p class="fnote">지도 마커의 색이 급지를 뜻합니다. 진할수록 높은 급지입니다.</p>
        </div>

        <div class="fgroup">
            <h4>학급수 (이상)</h4>
            <div class="frange">
                <input type="range" id="fClass" min="1" max="70" value="1">
                <b id="fClassVal">전체</b>
            </div>
        </div>

        <div class="fgroup">
            <h4>우리집에서 (직선거리)</h4>
            <div class="frange" id="fDistWrap">
                <input type="range" id="fDist" min="1" max="21" value="21">
                <b id="fDistVal">전체</b>
            </div>
            <button class="fsethome" id="fSetHome">지도에서 우리집 위치 정하기</button>
            <p class="fnote">직선거리 기준입니다. 실제 도로 거리는 이보다 깁니다.</p>
        </div>

        <div class="fgroup">
            <h4>연구학교</h4>
            <div class="fchips wide" id="fResearch"></div>
        </div>

        <div class="fgroup">
            <h4>IB학교</h4>
            <div class="fchips wide" id="fIb"></div>
        </div>

        <div class="fgroup">
            <h4>미래학교</h4>
            <div class="fchips wide" id="fFuture"></div>
        </div>

        <div class="fgroup">
            <h4>여러 조건을 함께 골랐을 때</h4>
            <div class="fchips wide" id="fMode"></div>
            <p class="fnote">연구학교·IB학교·미래학교 중 둘 이상을 골랐을 때, 모두 해당하는 학교만 볼지 하나만 해당해도 볼지 정합니다.</p>
        </div>

        <div class="factions">
            <button class="reset" id="fReset">초기화</button>
            <button class="apply" id="fApply">학교 보기</button>
        </div>
    </div>
</div>

<button id="homeBtn" aria-label="우리집 위치">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round">
        <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/>
    </svg>
</button>

<div id="pickbar">
    <span>지도에서 우리집 위치를 눌러주세요</span>
    <button id="pickCancel">취소</button>
</div>

<div id="scrim"></div>

<div id="sheet" aria-hidden="true">
    <div class="sheet-top">
        <div class="grabber"><i></i></div>
        <div class="sheet-head">
            <div class="ttl">
                <h2 id="sName">학교명</h2>
                <p id="sAddr">주소</p>
            </div>
            <button id="closeBtn" aria-label="닫기">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
                    <path d="M6 6l12 12M18 6L6 18"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="sheet-scroll">
        <div class="badges" id="sBadges"></div>

        <div class="commute" id="sCommuteBox">
            <div class="ic">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">
                    <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/>
                </svg>
            </div>
            <div class="txt">
                <b id="sCommute">—</b>
                <span id="sCommuteNote"></span>
            </div>
            <button class="set" id="sSetHome">설정</button>
        </div>

        <div class="stats" id="sStats"></div>
        <div class="rows" id="sRows"></div>

        <div class="route">
            <button class="primary" id="routeCar">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">
                    <path d="M5 17h14M6.5 17V11l1.8-4h7.4l1.8 4v6"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/>
                </svg>자동차 길찾기
            </button>
            <button class="ghost" id="routeBus">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">
                    <rect x="5" y="4" width="14" height="12" rx="2.5"/><path d="M5 10h14M8 20l1.5-4M16 20l-1.5-4"/>
                </svg>대중교통
            </button>
        </div>
        <p class="route-cap">네이버 지도에서 열립니다</p>
    </div>
</div>

<div id="toast"></div>

<!-- 🌟 작동(JavaScript) 파일 연결 (body 태그 닫기 직전에 넣는 것이 정석입니다) -->
<script src="app.js?v=11"></script>
</body>
</html>
