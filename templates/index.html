<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교어디(대구초등학교맵)</title>
    <meta name="description" content="전보 희망학교를 지도에서 한눈에. 교육지원청·급지·학급수·연구학교·IB·미래학교 조건으로 찾아보세요.">

    <!-- 🌟 카카오톡·SNS 미리보기 카드 (og:image, og:url은 절대주소가 필요해서 서버에서 채워준다) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="학교어디">
    <meta property="og:title" content="학교어디 — 대구 초등학교 지도">
    <meta property="og:description" content="전보 희망학교를 지도에서 한눈에. 교육지원청·급지·학급수·연구학교·IB·미래학교 조건으로 찾아보세요.">
    <!-- 이미지를 바꿀 때는 파일 이름도 함께 바꿔야 한다.
         카카오는 주소 기준으로 이미지를 저장해둬서, 이름이 같으면 새로 받아가지 않는다. -->
    <meta property="og:image" content="https://school-map-psi.vercel.app/og-image-v2.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://school-map-psi.vercel.app/">
    <meta name="twitter:card" content="summary_large_image">

    <!-- 🌟 외부 라이브러리 (네이버 지도, PapaParse) -->
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=b5s4g3nfru"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- 🌟 디자인(CSS) 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="search-box">
        <input type="text" id="searchInput" placeholder="학교명 검색 (예: 공산초)" onkeypress="if(event.keyCode==13) searchSchool()">
        <button id="searchBtn" onclick="searchSchool()">검색</button>
        <button id="toggleFilterBtn" onclick="toggleFilterPanel()" style="padding: 8px 16px; background: #7F8C8D; color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; font-weight: bold; white-space: nowrap; flex-shrink: 0;">▲ 세부검색</button>
    </div>

    <div id="filter-box">
        <select id="filter-district" onchange="applyFilters()">
            <option value="전체">지원청: 전체</option>
            <option value="동부">동부</option>
            <option value="서부">서부</option>
            <option value="남부">남부</option>
            <option value="달성">달성</option>
            <option value="군위">군위</option>
        </select>
        
        <div id="filter-grade" style="display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid #D5D8DC; border-radius: 4px; font-size: 13px; background: white; height: 34px; box-sizing: border-box;">
            <span style="color: #555; font-weight: bold;">급지:</span>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 3px;">
                <input type="checkbox" value="가" class="grade-cb cb-ga" checked onchange="applyFilters()">가
            </label>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 3px;">
                <input type="checkbox" value="나" class="grade-cb cb-na" checked onchange="applyFilters()">나
            </label>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 3px;">
                <input type="checkbox" value="다" class="grade-cb cb-da" checked onchange="applyFilters()">다
            </label>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 3px;">
                <input type="checkbox" value="라" class="grade-cb cb-ra" checked onchange="applyFilters()">라
            </label>
        </div>

        <div class="filter-break"></div>

        <select id="filter-research" onchange="applyFilters()">
            <option value="미설정">연구학교: 미설정</option>
            <option value="지정교">연구학교: 지정교</option>
            <option value="미지정교">연구학교: 미지정교</option>
        </select>
        
        <select id="filter-ib" onchange="applyFilters()">
            <option value="미설정">IB학교: 미설정</option>
            <option value="지정교">IB학교: 지정교(전체)</option>
            <option value="관심">관심학교</option>
            <option value="후보">후보학교</option>
            <option value="월드">월드스쿨</option>
            <option value="미지정교">IB학교: 미지정교</option>
        </select>
        
        <select id="filter-future" onchange="applyFilters()">
            <option value="미설정">미래학교: 미설정</option>
            <option value="지정교">미래학교: 지정교</option>
            <option value="미지정교">미래학교: 미지정교</option>
        </select>

        <div class="filter-break"></div>

        <div class="filter-mode-box" style="display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid #3498DB; border-radius: 4px; font-size: 13px; background: #EAF2F8; margin-left: 5px; height: 34px; box-sizing: border-box;">
            <span style="color: #2980B9; font-weight: bold;">검색조건:</span>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 3px;">
                <input type="radio" name="filter-mode" value="and" checked onchange="applyFilters()"> 모두 만족(교집합)
            </label>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 3px;">
                <input type="radio" name="filter-mode" value="or" onchange="applyFilters()"> 하나라도(합집합)
            </label>
        </div>

        <div class="filter-break"></div>

        <div class="filter-class-box" style="display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid #D5D8DC; border-radius: 4px; font-size: 13px; background: white; margin-left: 5px; height: 34px; box-sizing: border-box;">
            <span style="color: #555; font-weight: bold;">학급수(이상):</span>
            <input type="range" id="filter-class-count" min="1" max="70" value="1" oninput="updateClassCountDisplay()" onchange="applyFilters()" style="width: 80px; accent-color: #3498DB; cursor: pointer;">
            <span id="class-count-display" style="font-weight: bold; color: #2980B9; width: 20px; text-align: right;">1</span><span>학급</span>
        </div>

        <label class="filter-boundary" style="margin-left: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; height: 34px;">
            <input type="checkbox" id="toggle-boundary" onchange="toggleBoundaries()"> 지원청 구역
        </label>
    </div>
    
    <div id="map"></div>

    <!-- 🌟 작동(JavaScript) 파일 연결 (body 태그 닫기 직전에 넣는 것이 정석입니다) -->
    <script src="app.js"></script>
</body>
</html>
